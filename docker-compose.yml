# TiendaIA - Laboratorios 2, 3, 4 y 5 (Parte E: Perímetro y segmentación de redes)
# Iniciar con: docker compose up -d --build
# Antes: cp .env.ejemplo .env y configurar los valores.

x-servicio: &servicio
  restart: unless-stopped
  build: &construir
    context: .
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

services:
  # Bases de datos
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: tienda
      MYSQL_USER: tienda
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [interna]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [interna]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [interna]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Microservicios HTTP
  clientes:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: clientes}}
    environment:
      DATABASE_URL: mysql+pymysql://tienda:${MYSQL_PASSWORD}@mysql:3306/tienda
    networks: [interna]
    depends_on:
      mysql:
        condition: service_healthy

  productos:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: productos}}
    environment:
      MONGO_URL: mongodb://mongo:27017
    networks: [interna]
    depends_on:
      mongo:
        condition: service_healthy

  ventas:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ventas}}
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
    networks: [interna]
    depends_on:
      redis:
        condition: service_healthy
      clientes:
        condition: service_healthy
      productos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ia:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ia_service}}
    environment:
      VENTAS_URL: http://ventas:8000
      MODELO_PATH: /modelos/modelo.joblib
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
    volumes:
      - modelos:/modelos
    networks: [interna]
    depends_on:
      ventas:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: gateway}}
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    networks: [publica, interna]
    depends_on:
      clientes:
        condition: service_healthy
      productos:
        condition: service_healthy
      ventas:
        condition: service_healthy
      ia:
        condition: service_healthy

  # Broker y consumidores en segundo plano
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
    networks: [interna, gestion]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notificaciones:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: notificaciones}}
    healthcheck:
      disable: true
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
    networks: [interna]
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ia_service}}
    command: ["python", "worker.py"]
    healthcheck:
      disable: true
    environment:
      MODELO_PATH: /modelos/modelo.joblib
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RETARDO_MS: "200"
    volumes:
      - modelos:/modelos
    networks: [interna]
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  ia_listener:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: ia_listener}}
    command: ["python", "listener.py"]
    healthcheck:
      disable: true
    environment:
      REDIS_HOST: redis
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      IA_URL: "http://ia:8000"
    networks: [interna]
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      ia:
        condition: service_healthy

  # Almacenamiento de objetos
  seaweedfs:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: >-
      server -dir=/data -volume.max=100 -master.volumeSizeLimitMB=1024
      -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed_data:/data
      - ./seaweed/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [interna, publica]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
    networks: [interna, gestion]

  imagenes:
    <<: *servicio
    build: {<<: *construir, args: {SERVICIO: imagenes}}
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8081
      S3_BUCKET: tiendaia-imagenes
      S3_ACCESS_KEY: ${S3_ADMIN_KEY:?Configura S3_ADMIN_KEY en .env}
      S3_SECRET_KEY: ${S3_ADMIN_SECRET:?Configura S3_ADMIN_SECRET en .env}
      BlobEndpoint: http://azurite:10000/devstoreaccount1
      S3_PUBLIC_ENDPOINT_AZURE: http://localhost:10000/devstoreaccount1
      ALMACEN: ${ALMACEN:-azure}
    networks: [interna]
    depends_on:
      - seaweedfs
      - azurite
      - productos

  # Proxy perimetral y cliente web estático
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./perimetro/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    networks: [publica]
    depends_on:
      - gateway

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  modelos:
  seaweed_data:

networks:
  publica: {}
  interna:
    internal: true
  gestion: {}